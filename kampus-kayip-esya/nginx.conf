server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ═══════════════════════════════════════════════════════════
    # API reverse proxy — frontend'den /api çağrıları backend'e gider.
    #
    # DİKKAT: Buradaki "^~" işareti KRİTİK, silinmemeli.
    #
    # nginx location'ları şu sırayla değerlendirir:
    #   1) "=" tam eşleşme
    #   2) "^~" ön ek eşleşmesi   ← burası
    #   3) REGEX (~ ve ~*) eşleşmeleri
    #   4) normal ön ek eşleşmesi
    #
    # "^~" olmadan, aşağıdaki statik dosya regex'i (.png|.jpg ...)
    # normal ön ek eşleşmesinden ÖNCE değerlendirildiği için
    # /api/uploads/foto.png gibi istekleri kapıyordu. nginx onları
    # backend'e göndermek yerine kendi klasöründe arıyor, bulamayıp
    # 404 dönüyordu — yani yüklenen hiçbir görsel görünmüyordu.
    #
    # "^~" ile bu ön ek eşleşince regex'lere hiç bakılmaz.
    # ═══════════════════════════════════════════════════════════
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Yüklenen görseller 5MB'a kadar olabiliyor
        client_max_body_size 10M;
    }

    # Uygulamanın kendi statik dosyaları (JS, CSS, ikonlar) uzun süre cache'lenir.
    # Yüklenen kullanıcı görselleri buraya DÜŞMEZ; onlar yukarıdaki /api/ ile
    # backend'e gider.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA — bilinmeyen route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
