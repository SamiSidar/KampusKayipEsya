# ========================
# SUNUCU AYARLARI
# ========================
server.port=8080

# ========================
# MYSQL VERITABANI BAGLANTISI
# ========================
# Production'da environment variable kullanın:
# DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kampus_kayip_esya?useSSL=true&serverTimezone=Europe/Istanbul&allowPublicKeyRetrieval=true&requireSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / HIBERNATE AYARLARI
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false


# ========================
# JWT AYARLARI
# ========================
# Production'da environment variable kullanın: JWT_SECRET
jwt.secret=${JWT_SECRET:YediTepeUniversitesiKampusKayipEsyaUygulamasiGizliAnahtar2024SecretKey}
# Access token: 15 dakika (900000 ms)
jwt.access-token-expiration=900000
# Refresh token: 7 gün (604800000 ms)
jwt.refresh-token-expiration=604800000


# ========================
# DOSYA UPLOAD AYARLARI
# ========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# ========================
# UYGULAMA ADI
# ========================
spring.application.name=kampus-kayip-esya-backend

# ========================
# CONNECTION POOL (HikariCP) AYARLARI
# ========================
# Aynı anda açık tutulacak maksimum bağlantı sayısı
spring.datasource.hikari.maximum-pool-size=10
# Havuzda boşta bekleyecek minimum bağlantı
spring.datasource.hikari.minimum-idle=5
# Bağlantı bekleme süresi (ms) — aşılırsa hata fırlatır
spring.datasource.hikari.connection-timeout=20000
# Boşta kalan bağlantı ne kadar süre açık kalsın (ms)
spring.datasource.hikari.idle-timeout=300000
# Bir bağlantının maksimum ömrü (ms) — 30 dakika
spring.datasource.hikari.max-lifetime=1800000

# ========================
# PERFORMANS AYARLARI
# ========================
# Gzip sıkıştırma — büyük JSON yanıtlarını küçültür
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024

# Tomcat thread havuzu
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
# Bağlantı kuyruğu — tüm thread'ler doluysa kaç istek bekleyebilir
server.tomcat.accept-count=100

# ========================
# GÜVENLİK AYARLARI
# ========================
# Hata sayfasında stack trace, sunucu bilgisi vb. gösterme
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
# Spring Boot varsayılan whitelabel hata sayfasını kapat
server.error.whitelabel.enabled=false
# SQL logları artık varsayılan olarak kapalı (show-sql=false)
